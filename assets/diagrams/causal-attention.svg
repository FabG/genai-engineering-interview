<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" role="img" aria-labelledby="title desc">
<title id="title">Causal attention mask</title>
<desc id="desc">Four query rows and key columns. Each query may attend to its own position and earlier positions. All future positions are blocked.</desc>
<rect width="880" height="510" rx="16" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="43" font-size="26" fill="#24364b" text-anchor="start" font-weight="700">Causal attention can look back, not ahead</text>
<text x="32" y="73" font-size="17" fill="#52647a" text-anchor="start" font-weight="400">Connections allowed by the mask; these are not attention weights</text>
<text x="400" y="112" font-size="18" fill="#24364b" text-anchor="middle" font-weight="700">Key positions</text>
<text x="32" y="167" font-size="18" fill="#24364b" text-anchor="start" font-weight="700">Query</text>
<text x="32" y="191" font-size="18" fill="#24364b" text-anchor="start" font-weight="700">positions</text>
<text x="226" y="147" font-size="18" fill="#24364b" text-anchor="middle" font-weight="700">1</text>
<text x="334" y="147" font-size="18" fill="#24364b" text-anchor="middle" font-weight="700">2</text>
<text x="442" y="147" font-size="18" fill="#24364b" text-anchor="middle" font-weight="700">3</text>
<text x="550" y="147" font-size="18" fill="#24364b" text-anchor="middle" font-weight="700">4</text>
<text x="146" y="201" font-size="18" fill="#24364b" text-anchor="middle" font-weight="700">1</text>
<rect x="176" y="163" width="100" height="62" rx="8" fill="#d4f0e9"/>
<text x="226" y="201" font-size="16" fill="#24364b" text-anchor="middle" font-weight="400">Allow</text>
<rect x="284" y="163" width="100" height="62" rx="8" fill="#e4e9f0"/>
<text x="334" y="201" font-size="16" fill="#24364b" text-anchor="middle" font-weight="400">Block</text>
<rect x="392" y="163" width="100" height="62" rx="8" fill="#e4e9f0"/>
<text x="442" y="201" font-size="16" fill="#24364b" text-anchor="middle" font-weight="400">Block</text>
<rect x="500" y="163" width="100" height="62" rx="8" fill="#e4e9f0"/>
<text x="550" y="201" font-size="16" fill="#24364b" text-anchor="middle" font-weight="400">Block</text>
