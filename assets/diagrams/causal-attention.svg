<text x="442" y="271" font-size="16" fill="#24364b" text-anchor="middle" font-weight="400">Block</text>
<rect x="500" y="233" width="100" height="62" rx="8" fill="#e4e9f0"/>
<text x="550" y="271" font-size="16" fill="#24364b" text-anchor="middle" font-weight="400">Block</text>
<text x="146" y="341" font-size="18" fill="#24364b" text-anchor="middle" font-weight="700">3</text>
<rect x="176" y="303" width="100" height="62" rx="8" fill="#d4f0e9"/>
<text x="226" y="341" font-size="16" fill="#24364b" text-anchor="middle" font-weight="400">Allow</text>
