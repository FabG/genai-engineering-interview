<text x="550" y="411" font-size="16" fill="#24364b" text-anchor="middle" font-weight="400">Allow</text>
<text x="640" y="194" font-size="18" fill="#24364b" text-anchor="start" font-weight="700">At query position 3:</text>
<text x="640" y="224" font-size="17" fill="#24364b" text-anchor="start" font-weight="400">keys 1, 2, 3 are visible;</text>
<text x="640" y="251" font-size="17" fill="#24364b" text-anchor="start" font-weight="400">key 4 is hidden.</text>
<text x="32" y="474" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Future positions are masked before softmax; each row predicts the next token.</text>
</g>
