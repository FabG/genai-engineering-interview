<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .dev { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .gw { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .scale { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .otel { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">LLM observability — overlapping capabilities, shared telemetry</text>

  <rect x="40" y="50" width="280" height="210" class="dev"/>
  <text x="180" y="72" text-anchor="middle" class="head">development platforms</text>
  <text x="180" y="92" text-anchor="middle" class="small">traces + evals + prompts + sessions</text>
  <rect x="60" y="110" width="240" height="35" class="box"/>
  <text x="180" y="132" text-anchor="middle" class="step">LangSmith</text>
  <rect x="60" y="150" width="240" height="35" class="box"/>
  <text x="180" y="172" text-anchor="middle" class="step">Langfuse</text>
  <rect x="60" y="190" width="240" height="35" class="box"/>
  <text x="180" y="212" text-anchor="middle" class="step">Opik</text>
  <text x="180" y="245" text-anchor="middle" class="caption">tracing, iteration, and production workflows</text>

  <rect x="340" y="50" width="280" height="210" class="gw"/>
  <text x="480" y="72" text-anchor="middle" class="head">gateway / telemetry</text>
  <text x="480" y="92" text-anchor="middle" class="small">traces + metrics + gateway features</text>
  <rect x="360" y="110" width="240" height="35" class="box"/>
  <text x="480" y="132" text-anchor="middle" class="step">Helicone</text>
  <rect x="360" y="150" width="240" height="35" class="box"/>
  <text x="480" y="172" text-anchor="middle" class="step">SigNoz</text>
  <rect x="360" y="190" width="240" height="35" class="box"/>
  <text x="480" y="212" text-anchor="middle" class="step">OpenLLMetry</text>
  <text x="480" y="245" text-anchor="middle" class="caption">gateway, backend, and instrumentation roles</text>

  <rect x="640" y="50" width="280" height="210" class="scale"/>
  <text x="780" y="72" text-anchor="middle" class="head">evaluation and analytics</text>
  <text x="780" y="92" text-anchor="middle" class="small">traces, datasets, experiments, storage</text>
  <rect x="660" y="110" width="240" height="35" class="box"/>
  <text x="780" y="132" text-anchor="middle" class="step">Phoenix</text>
  <rect x="660" y="150" width="240" height="35" class="box"/>
  <text x="780" y="172" text-anchor="middle" class="step">Arize AX</text>
  <rect x="660" y="190" width="240" height="35" class="box"/>
  <text x="780" y="212" text-anchor="middle" class="step">Governed trace archive</text>
  <text x="780" y="245" text-anchor="middle" class="caption">validate deployment and integration needs</text>

  <rect x="40" y="280" width="880" height="100" class="otel"/>
  <text x="480" y="302" text-anchor="middle" class="head">OpenTelemetry GenAI conventions — the glue</text>
  <text x="480" y="325" text-anchor="middle" class="step">trace IDs · model · usage · timing · status · versioned attribute mappings</text>
  <text x="480" y="345" text-anchor="middle" class="small">Telemetry path (separate from model request routing):</text>
  <text x="480" y="363" text-anchor="middle" class="step">instrumentation → collector → backend / evaluation / archive</text>

  <rect x="40" y="400" width="880" height="100" class="box"/>
  <text x="480" y="422" text-anchor="middle" class="head">sampling at scale — choose retention from evidence and budget</text>
  <text x="480" y="444" text-anchor="middle" class="step">example: retain errors + high-cost traces + 5% baseline</text>
  <text x="480" y="462" text-anchor="middle" class="step">full-population metrics separately · monitor telemetry loss</text>
  <text x="480" y="482" text-anchor="middle" class="caption">Tail retention needs complete incoming traces; retained error rates are not population rates.</text>
</svg>
