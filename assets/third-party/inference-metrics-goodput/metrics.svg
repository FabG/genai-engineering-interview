<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">Inference metrics — latency, throughput, and useful work</text>

  <rect x="40" y="50" width="440" height="230" class="box"/>
  <text x="260" y="72" text-anchor="middle" class="head">latency and throughput</text>
  <rect x="60" y="90" width="400" height="35" class="cool"/>
  <text x="260" y="112" text-anchor="middle" class="step">TTFT = first token − submission</text>
  <rect x="60" y="130" width="400" height="35" class="cold"/>
  <text x="260" y="152" text-anchor="middle" class="step">TPOT = mean post-first-token gap</text>
  <rect x="60" y="170" width="400" height="35" class="dsk"/>
  <text x="260" y="192" text-anchor="middle" class="step">E2E = TTFT + TPOT * (N − 1)</text>
  <rect x="60" y="210" width="400" height="35" class="hot"/>
  <text x="260" y="232" text-anchor="middle" class="step">throughput = output_tokens / elapsed</text>
  <text x="260" y="263" text-anchor="middle" class="caption">throughput is a fleet metric, not a user metric</text>

  <rect x="500" y="50" width="420" height="230" class="box"/>
  <text x="710" y="72" text-anchor="middle" class="head">goodput — the SLO gate</text>
  <rect x="520" y="90" width="380" height="115" class="cool"/>
  <text x="710" y="112" text-anchor="middle" class="step">attainment = good / offered</text>
  <text x="710" y="132" text-anchor="middle" class="small">request TTFT &lt;= a  AND</text>
  <text x="710" y="150" text-anchor="middle" class="small">request TPOT &lt;= b  AND</text>
  <text x="710" y="168" text-anchor="middle" class="small">request E2E &lt;= c</text>
  <text x="710" y="190" text-anchor="middle" class="small">also require success and nonempty output</text>
  <rect x="520" y="215" width="380" height="55" class="hot"/>
  <text x="710" y="237" text-anchor="middle" class="step">request goodput = good / seconds</text>
  <text x="710" y="256" text-anchor="middle" class="small">fraction and rate answer different questions</text>

  <rect x="40" y="300" width="440" height="230" class="box"/>
  <text x="260" y="322" text-anchor="middle" class="head">percentiles — never mean alone</text>
  <rect x="60" y="340" width="400" height="35" class="cool"/>
  <text x="260" y="362" text-anchor="middle" class="step">always P50, P90, P99</text>
  <rect x="60" y="380" width="400" height="35" class="cold"/>
  <text x="260" y="402" text-anchor="middle" class="step">latency tails can hide behind averages</text>
  <rect x="60" y="420" width="400" height="35" class="hot"/>
  <text x="260" y="442" text-anchor="middle" class="step">synthetic: 500 × 7 ms + 20 × 60 ms</text>
  <rect x="60" y="460" width="400" height="55" class="dsk"/>
  <text x="260" y="482" text-anchor="middle" class="step">mean 9.04 ms; nearest-rank P99 60 ms</text>
  <text x="260" y="500" text-anchor="middle" class="small">report sample count and percentile estimator</text>

  <rect x="500" y="300" width="420" height="230" class="box"/>
  <text x="710" y="322" text-anchor="middle" class="head">measurement trap</text>
  <rect x="520" y="340" width="380" height="50" class="hot"/>
  <text x="710" y="362" text-anchor="middle" class="step">different averaging conventions</text>
  <text x="710" y="380" text-anchor="middle" class="small">same trace, different statistics</text>
  <rect x="520" y="395" width="380" height="55" class="cool"/>
  <text x="710" y="417" text-anchor="middle" class="step">post-first-token average</text>
  <text x="710" y="435" text-anchor="middle" class="small">(E2E − TTFT) / (N − 1), for N > 1</text>
  <rect x="520" y="455" width="380" height="55" class="cold"/>
  <text x="710" y="477" text-anchor="middle" class="step">whole-response average</text>
  <text x="710" y="495" text-anchor="middle" class="small">E2E / N includes the initial wait</text>
  <text x="710" y="522" text-anchor="middle" class="caption">state tool + version in every report</text>
</svg>
