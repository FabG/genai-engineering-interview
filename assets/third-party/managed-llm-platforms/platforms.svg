<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .aws { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .az { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .gcp { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">Managed LLM platforms — compare deployment choices</text>

  <rect x="40" y="50" width="280" height="440" class="box"/>
  <text x="180" y="72" text-anchor="middle" class="head">AWS Bedrock</text>
  <rect x="60" y="90" width="240" height="60" class="aws"/>
  <text x="180" y="110" text-anchor="middle" class="step">AWS and partner models</text>
  <text x="180" y="128" text-anchor="middle" class="small">Verify catalog and region</text>
  <text x="180" y="144" text-anchor="middle" class="small">AWS identity and monitoring</text>
  <rect x="60" y="160" width="240" height="80" class="aws"/>
  <text x="180" y="182" text-anchor="middle" class="step">Application profiles</text>
  <text x="180" y="200" text-anchor="middle" class="small">Usage metrics and billing tags</text>
  <text x="180" y="216" text-anchor="middle" class="small">tag team / product / feature</text>
  <text x="180" y="232" text-anchor="middle" class="small">Reconcile with billing data</text>
  <rect x="60" y="250" width="240" height="70" class="box"/>
  <text x="180" y="272" text-anchor="middle" class="step">Measure latency tails</text>
  <text x="180" y="290" text-anchor="middle" class="small">Check model and capacity mode</text>
  <text x="180" y="306" text-anchor="middle" class="small">Use a dated quote or rate card</text>
  <rect x="60" y="330" width="240" height="90" class="dsk"/>
  <text x="180" y="352" text-anchor="middle" class="step">Evaluate model fit</text>
  <text x="180" y="370" text-anchor="middle" class="small">Test capabilities and quality</text>
  <text x="180" y="390" text-anchor="middle" class="small">Check data paths and contracts</text>
  <text x="180" y="410" text-anchor="middle" class="small">Configure access and controls</text>

  <rect x="340" y="50" width="280" height="440" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">Azure OpenAI / Foundry</text>
  <rect x="360" y="90" width="240" height="60" class="az"/>
  <text x="480" y="110" text-anchor="middle" class="step">Azure-hosted OpenAI models</text>
  <text x="480" y="128" text-anchor="middle" class="small">Broader Foundry catalog exists</text>
  <text x="480" y="144" text-anchor="middle" class="small">Verify model and deployment type</text>
  <rect x="360" y="160" width="240" height="80" class="az"/>
  <text x="480" y="182" text-anchor="middle" class="step">PTU capacity planning</text>
  <text x="480" y="200" text-anchor="middle" class="small">Allocated model processing</text>
  <text x="480" y="216" text-anchor="middle" class="small">Idle capacity still costs money</text>
  <text x="480" y="232" text-anchor="middle" class="small">Calculate workload break-even</text>
  <rect x="360" y="250" width="240" height="70" class="box"/>
  <text x="480" y="272" text-anchor="middle" class="step">Benchmark the workload</text>
  <text x="480" y="290" text-anchor="middle" class="small">Same prompts and concurrency</text>
  <text x="480" y="306" text-anchor="middle" class="small">Report errors alongside p99</text>
  <rect x="360" y="330" width="240" height="90" class="dsk"/>
  <text x="480" y="352" text-anchor="middle" class="step">Check operational fit</text>
  <text x="480" y="370" text-anchor="middle" class="small">Scopes, tags, app telemetry</text>
  <text x="480" y="390" text-anchor="middle" class="small">Validate contractual scope</text>
  <text x="480" y="410" text-anchor="middle" class="small">Verify location and retention</text>

  <rect x="640" y="50" width="280" height="440" class="box"/>
  <text x="780" y="72" text-anchor="middle" class="head">Vertex AI / Google Cloud</text>
  <rect x="660" y="90" width="240" height="60" class="gcp"/>
  <text x="780" y="110" text-anchor="middle" class="step">Gemini and Model Garden</text>
  <text x="780" y="128" text-anchor="middle" class="small">Features vary by model</text>
  <text x="780" y="144" text-anchor="middle" class="small">Managed and deployment options</text>
  <rect x="660" y="160" width="240" height="80" class="gcp"/>
  <text x="780" y="182" text-anchor="middle" class="step">BigQuery billing export</text>
  <text x="780" y="200" text-anchor="middle" class="small">Projects and supported labels</text>
  <text x="780" y="216" text-anchor="middle" class="small">arbitrary SQL on cost data</text>
  <text x="780" y="232" text-anchor="middle" class="small">Reconcile application usage</text>
  <rect x="660" y="250" width="240" height="70" class="box"/>
  <text x="780" y="272" text-anchor="middle" class="step">Measure capacity and cost</text>
  <text x="780" y="290" text-anchor="middle" class="small">Check on-demand options</text>
  <text x="780" y="306" text-anchor="middle" class="small">Check provisioned eligibility</text>
  <rect x="660" y="330" width="240" height="90" class="dsk"/>
  <text x="780" y="352" text-anchor="middle" class="step">Evaluate required modalities</text>
  <text x="780" y="370" text-anchor="middle" class="small">Test realistic context lengths</text>
  <text x="780" y="390" text-anchor="middle" class="small">Verify exact serving option</text>
  <text x="780" y="410" text-anchor="middle" class="small">Validate data-handling terms</text>

  <rect x="40" y="500" width="880" height="50" class="box"/>
  <text x="480" y="520" text-anchor="middle" class="step">Choose primary and recovery routes from tested requirements</text>
  <text x="480" y="540" text-anchor="middle" class="small">Compare quality, capacity, total cost, data paths, and operational complexity</text>
</svg>
